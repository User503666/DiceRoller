<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roll for Dinner - Fate Log</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --card-hover: #f0f4f8;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --accent: #e74c3c;
      --border-radius: 12px;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    /* Fate Log List */
    .fate-log-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Full Card Click Target */
    .fate-log-item {
      display: flex;
      align-items: center;
      background-color: var(--card-bg);
      padding: 14px 16px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, transform 0.1s ease;
      /* Prevents clipping/overflow on tight mobile viewports */
      overflow: hidden; 
    }

    .fate-log-item:hover {
      background-color: var(--card-hover);
    }

    .fate-log-item:active {
      transform: scale(0.98);
    }

    .fate-log-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .dice-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #edf2f7;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 8px;
      margin-right: 12px;
      flex-shrink: 0; /* Ensures dice badge never compresses */
    }

    .meal-name {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-main);
      flex-grow: 1;
      /* Graceful text truncation for long meal titles on phone screens */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tap-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: 8px;
      flex-shrink: 0;
    }

    /* Modal / Objection Popup */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-roll {
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 12px;
    }

    .modal-description {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .btn {
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background-color: #edf2f7;
      color: var(--text-main);
    }

    .btn-danger {
      background-color: var(--accent);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Fate Log</h2>
    <div class="fate-log-list" id="fateLog"></div>
  </div>

  <!-- Objection / Inspect Popup -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-roll" id="modalRoll">🎲 Roll: -</div>
      <h3 class="modal-title" id="modalTitle">Meal Name</h3>
      <p class="modal-description" id="modalDesc">
        Would you like to object to this outcome or view details?
      </p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeBtn">Close</button>
        <button class="btn btn-danger" id="objectBtn">Object!</button>
      </div>
    </div>
  </div>

  <script>
    // Sample Log Data
    const fateLogData = [
      { id: 1, roll: 12, name: "Slow-Cooked Beef Birria Tacos with Consomé dipping sauce", desc: "A rich, flavorful Mexican dish featuring tender shredded beef served in pan-fried tortillas." },
      { id: 2, roll: 5, name: "Homemade Margherita Pizza", desc: "Classic pizza topped with fresh mozzarella, basil leaves, and tomato sauce." },
      { id: 3, roll: 18, name: "Creamy Garlic Parmesan Fettuccine Alfredo with Grilled Chicken", desc: "Rich pasta tossed in a velvety butter and parmesan sauce." }
    ];

    const fateLogContainer = document.getElementById("fateLog");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalRoll = document.getElementById("modalRoll");
    const modalTitle = document.getElementById("modalTitle");
    const modalDesc = document.getElementById("modalDesc");
    const closeBtn = document.getElementById("closeBtn");
    const objectBtn = document.getElementById("objectBtn");

    // Render Log Items
    function renderLog() {
      fateLogContainer.innerHTML = "";
      fateLogData.forEach(item => {
        const row = document.createElement("div");
        row.className = "fate-log-item";
        row.setAttribute("role", "button");
        row.setAttribute("tabindex", "0");

        row.innerHTML = `
          <span class="dice-badge">🎲 ${item.roll}</span>
          <span class="meal-name">${item.name}</span>
          <span class="tap-hint">›</span>
        `;

        // Click handler on full card
        row.addEventListener("click", () => openModal(item));

        // Keyboard navigation (Enter or Space)
        row.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openModal(item);
          }
        });

        fateLogContainer.appendChild(row);
      });
    }

    function openModal(item) {
      modalRoll.textContent = `🎲 Roll: ${item.roll}`;
      modalTitle.textContent = item.name;
      modalDesc.textContent = item.desc;
      modalOverlay.classList.add("active");
    }

    function closeModal() {
      modalOverlay.classList.remove("active");
    }

    closeBtn.addEventListener("click", closeModal);
    objectBtn.addEventListener("click", () => {
      alert(`Objection raised for: ${modalTitle.textContent}`);
      closeModal();
    });

    // Close modal when tapping outside card
    modalOverlay.addEventListener("click", (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    renderLog();
  </script>

</body>
</html>
